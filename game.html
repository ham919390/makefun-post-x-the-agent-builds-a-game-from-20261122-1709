<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON STAR RUN — built from one prompt</title>
<style>
  html, body { margin:0; padding:0; background:#050914; height:100%; overflow:hidden;
    font-family:'Segoe UI', system-ui, sans-serif; color:#eaf6ff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 800px at 50% 20%, #0b1e3a 0%, #050914 60%); }
  canvas { display:block; border-radius:14px; box-shadow:0 0 60px rgba(0,229,255,.25), 0 0 4px rgba(255,43,214,.6);
    touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="540" height="960"></canvas></div>
<script>
'use strict';
// NEON STAR RUN — pilot the ship, dodge the asteroids, grab the stars.
// Built by an AI agent from one prompt, in one HTML file.
const W = 540, H = 960;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

// deterministic-ish starfield background
const bgStars = [];
for (let i = 0; i < 90; i++) bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.4, v: Math.random() * 40 + 14 });

const ship = { x: W / 2, y: H - 130, tx: W / 2, r: 20, tilt: 0 };
let rocks = [], stars = [], sparks = [];
let score = 0, lives = 3, t = 0, spawnT = 0, starT = 1.2, over = false, started = false;
let keys = {};

function spawnRock() {
  const r = 16 + Math.random() * 26;
  rocks.push({ x: r + Math.random() * (W - 2 * r), y: -r, r, vy: 200 + Math.random() * 160 + t * 6,
    rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 2.4,
    pts: Array.from({ length: 9 }, (_, i) => 0.75 + Math.random() * 0.45) });
}
function spawnStar() {
  stars.push({ x: 24 + Math.random() * (W - 48), y: -24, r: 15, vy: 170 + Math.random() * 60, ph: Math.random() * 6.28 });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = 60 + Math.random() * 220;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.4, color });
  }
}
function reset() {
  rocks = []; stars = []; sparks = []; score = 0; lives = 3; t = 0; over = false;
  ship.x = ship.tx = W / 2;
}

window.addEventListener('keydown', e => { keys[e.key] = true; if (!started || over) { started = true; if (over) reset(); } });
window.addEventListener('keyup', e => { keys[e.key] = false; });
function point(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  ship.tx = (cx - r.left) / r.width * W;
  started = true; if (over) reset();
}
cv.addEventListener('mousemove', point);
cv.addEventListener('touchstart', point, { passive: true });
cv.addEventListener('touchmove', point, { passive: true });
cv.addEventListener('mousedown', point);

function star(x, y, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  ctx.fillStyle = '#050914'; ctx.fillRect(0, 0, W, H);
  for (const s of bgStars) {
    s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    ctx.fillStyle = 'rgba(180,230,255,0.8)'; ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  if (started && !over) {
    t += dt;
    if (keys['ArrowLeft']) ship.tx -= 420 * dt;
    if (keys['ArrowRight']) ship.tx += 420 * dt;
    ship.tx = Math.max(26, Math.min(W - 26, ship.tx));
    ship.tilt += ((ship.tx - ship.x) * 0.004 - ship.tilt) * 0.2;
    ship.x += (ship.tx - ship.x) * Math.min(1, dt * 14);
    spawnT -= dt; if (spawnT <= 0) { spawnRock(); spawnT = Math.max(0.34, 0.85 - t * 0.012); }
    starT -= dt; if (starT <= 0) { spawnStar(); starT = 1.1 + Math.random() * 1.3; }
    for (const r of rocks) {
      r.y += r.vy * dt; r.rot += r.vr * dt;
      const dx = r.x - ship.x, dy = r.y - ship.y;
      if (dx * dx + dy * dy < (r.r + ship.r - 6) * (r.r + ship.r - 6)) {
        burst(ship.x, ship.y, '#ff2bd6', 26); lives--; r.y = H + 200;
        if (lives <= 0) { over = true; burst(ship.x, ship.y, '#ffd319', 46); }
      }
    }
    rocks = rocks.filter(r => r.y < H + 80);
    for (const s of stars) {
      s.y += s.vy * dt; s.ph += dt * 5;
      const dx = s.x - ship.x, dy = s.y - ship.y;
      if (dx * dx + dy * dy < 52 * 52) { score += 10; burst(s.x, s.y, '#ffd319', 14); s.y = H + 200; }
    }
    stars = stars.filter(s => s.y < H + 60);
  }
  for (const r of rocks) {
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.beginPath();
    r.pts.forEach((p, i) => { const a = i / r.pts.length * 6.283; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r.r * p, Math.sin(a) * r.r * p); });
    ctx.closePath(); ctx.fillStyle = '#2a3550'; ctx.fill();
    ctx.strokeStyle = '#ff5470'; ctx.lineWidth = 2.5; ctx.shadowColor = '#ff5470'; ctx.shadowBlur = 12; ctx.stroke(); ctx.restore();
  }
  for (const s of stars) star(s.x, s.y + Math.sin(s.ph) * 3, s.r, '#ffd319');
  for (const p of sparks) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    ctx.globalAlpha = Math.max(0, p.life * 1.8); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  // the ship: neon triangle with a flame
  if (!over) {
    ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.tilt);
    const fl = 12 + Math.random() * 9;
    ctx.beginPath(); ctx.moveTo(-8, 16); ctx.lineTo(0, 16 + fl); ctx.lineTo(8, 16);
    ctx.fillStyle = '#ff9f1c'; ctx.shadowColor = '#ff9f1c'; ctx.shadowBlur = 16; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(19, 16); ctx.lineTo(0, 7); ctx.lineTo(-19, 16); ctx.closePath();
    ctx.fillStyle = '#0e2a47'; ctx.fill(); ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3;
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 18; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -4, 5.5, 0, 6.283); ctx.fillStyle = '#bffbff'; ctx.fill();
    ctx.restore();
  }
  // HUD
  ctx.fillStyle = '#eaf6ff'; ctx.font = '700 30px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 22, 46);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ff5470';
  ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 22, 46);
  ctx.textAlign = 'center'; ctx.fillStyle = '#00e5ff'; ctx.font = '700 22px system-ui, sans-serif';
  ctx.fillText('NEON STAR RUN', W / 2, 46);
  if (!started) {
    ctx.fillStyle = 'rgba(5,9,20,0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd319'; ctx.font = '800 44px system-ui, sans-serif'; ctx.fillText('NEON STAR RUN', W / 2, H / 2 - 60);
    ctx.fillStyle = '#eaf6ff'; ctx.font = '500 24px system-ui, sans-serif';
    ctx.fillText('Dodge the asteroids. Grab the stars.', W / 2, H / 2 - 8);
    ctx.fillText('Move: mouse, touch or arrow keys', W / 2, H / 2 + 34);
    ctx.fillStyle = '#00e5ff'; ctx.font = '700 26px system-ui, sans-serif';
    ctx.fillText('CLICK OR PRESS A KEY TO PLAY', W / 2, H / 2 + 96);
  }
  if (over) {
    ctx.fillStyle = 'rgba(5,9,20,0.78)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5470'; ctx.font = '800 48px system-ui, sans-serif'; ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
    ctx.fillStyle = '#eaf6ff'; ctx.font = '700 30px system-ui, sans-serif';
    ctx.fillText('SCORE ' + score, W / 2, H / 2 + 24);
    ctx.fillStyle = '#00e5ff'; ctx.font = '600 22px system-ui, sans-serif';
    ctx.fillText('press any key to play again', W / 2, H / 2 + 72);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
